<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DarkMode Plugin</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="logo">
    <img src="images/logo.png" alt="Darko Mode Logo" class="logo-img" />
    <span class="logo-text">DARK MODE</span>
  </div>
  <!-- Background moon image -->
  <div class="moon-background">
    <img src="images/moon.png" alt="Dark Mode Moon" class="moon-img" />
  </div>
  
  <div class="content-border">
    <div id="toggle-container">
      <div class="toggle-instruction">Click the toggle above to experience dark mode</div>
    </div>
    <div class="demo-section">
      <h2 class="demo-title">Live Demo</h2>
      <iframe src="demo.html" class="demo-frame" title="Dark Mode Toggle Demo"></iframe>
      <p>
        Effortless, theme-aware dark mode for any website—just plug and play.
      </p>
    </div>
    <div class="cloud-overlay"></div>
  </div>
  <div class="feature-description">
  </div>
  <script src="darkmode-toggle.js"></script>
</body>
</html>
